[package]
name = "tailzip"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.36"
rfd = "0.17"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "aes-crypto", "bzip2", "deflate64", "lzma", "ppmd", "xz", "zstd"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "util", "aes256"] }
sys-locale = "0.3"
unrar = "0.5"
unalz = "0.2"
unegg = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3

[dev-dependencies]
crc32fast = "1"
# Offscreen screenshots of the UI (ignored test `ui_screenshots`).
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }

[build-dependencies]
embed-resource = "3"
cc = "1"
